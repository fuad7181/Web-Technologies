<!DOCTYPE Html>
<html>
    <title>Register Form With Z Index</title>
    
    <style>
    .content {
  max-width: 400px;
  margin: auto;
  background: white;
  padding: 10px;
  margin-top: 150px;
  border-radius: 10px;
}

input[type=text], select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid black;
  border-radius: 4px;
  box-sizing: border-box;
}

input[type=submit] {
  width: 100%;
  background-color: Blue;
  color: white;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 4px; 
}

h1 {
  text-align: center;
}

body {
  background-image: url("fuad1.jpg");
}

.lightblue-box {
  position: absolute;
  background: lightblue;
  width: 5%;
  left: 930px;
  top: 120px;
  height: 70px;
  opacity: 0.3;
}
</style>


    
  
<body>
    <div class="content">
  <h1>Register</h1>
  <input type="text" id="fname" name="fullname" placeholder="Full Name">

  <input type="text" id="password" name="password" placeholder="Password">
  <input type="submit" value="Create Account">
    </div>

<div class="container">
  <div class="lightblue-box"></div>
</div>
